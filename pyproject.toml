[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-tip-calibration"
version = "0.1.0"
description = "Interactive endpoint calibration for 3D probe point clouds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
]

[project.scripts]
probe-calibrate = "probe_calibration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
